interface:
  display_name: "Debug AI Writing"
  short_description: "修复内容空洞、逻辑跳步与免责声明式表达，写出有用、连贯、自然的中文"
  default_prompt: "Use $debug-aiwriting to develop useful substance and coherent reasoning for the intended reader and genre. Repair the main writing failure, preserve facts and authorized scope, retain consequential qualifications, and deliver the strongest clean draft."

policy:
  allow_implicit_invocation: true
