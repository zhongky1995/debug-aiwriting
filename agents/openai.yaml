interface:
  display_name: "Debug AI Writing"
  short_description: "围绕读者目标、内容工序与整体取舍调试中文写作，防止修改跑偏"
  default_prompt: "Use $debug-aiwriting to establish the reader outcome, evidence, genre, and authorized scope; resolve the governing writing problem, compose a coherent whole, and accept revisions only after checking the complete artifact against the current purpose."

policy:
  allow_implicit_invocation: true
